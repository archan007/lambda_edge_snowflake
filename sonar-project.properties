# SonarQube project configuration
# =================================
# Read by the SonarQube scanner invoked from
# .github/workflows/sonarqube.yml on every PR targeting main.
#
# projectKey / projectName / projectVersion / host.url are placeholders —
# replace with the real values for your self-hosted SonarQube instance
# before this runs for real. SONAR_TOKEN is NOT set here — it stays a
# GitHub Actions secret (org-level), never committed to the repo.

sonar.projectKey=CHANGE_ME_PROJECT_KEY
sonar.projectName=CHANGE_ME_PROJECT_NAME
sonar.projectVersion=CHANGE_ME_VERSION
sonar.host.url=CHANGE_ME_SONAR_HOST_URL

sonar.sourceEncoding=UTF-8

# Two independent Lambda codebases live side by side in this repo.
sonar.sources=core_lambda,edge_lambda
sonar.tests=core_lambda/tests,tests
sonar.exclusions=**/.build/**,**/__pycache__/**

sonar.python.version=3.13

# Coverage reports produced by the pytest --cov steps in the workflow.
sonar.python.coverage.reportPaths=core_lambda/coverage-core.xml,coverage-edge.xml
